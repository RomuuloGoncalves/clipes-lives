[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipes"
version = "0.1.0"
description = "CPU-only stream & VOD highlight clipper"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]",
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["clipes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
