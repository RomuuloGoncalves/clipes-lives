[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipes"
version = "0.1.0"
description = "CPU-only stream & VOD highlight clipper"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default,curl-cffi]",
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
live = [
    "streamlink>=7.0",
]
coord = [
    "pymongo>=4.8",
]
bot = [
    "discord.py>=2.4,<3",
]
visao = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "opencv-python-headless>=4.9",
]
dev = [
    "pytest>=8.0.0",
    "mongomock>=4.3",
]

[tool.setuptools.packages.find]
include = ["clipes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/pytest_cache"
