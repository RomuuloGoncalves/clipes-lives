name: clipes-lives

services:
  clipes:
    build:
      context: .
      # args:
      #   WITH_LLM_4B: 1  # baixa e ativa Qwen3-4B (~2,5 GB extra, ~4,5 GB RAM)
    image: clipes-lives:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    mem_limit: ${CLIPES_MEM:-5g}
    cpus: ${CLIPES_CPUS:-3}
    cpu_shares: 256
    # Sem condition de saude: o vigia pode falhar sem impedir o clipes.
    depends_on:
      - vigia
    environment:
      OUT_DIR: /out
      HOME: /cache
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      CLIPES_WHISPER_MODEL: ${CLIPES_WHISPER_MODEL:-small}
      CLIPES_CPU_THREADS: ${CLIPES_CPU_THREADS:-3}
      CLIPES_PORTAO: ${CLIPES_PORTAO:-}
      CLIPES_MIN_WPS: ${CLIPES_MIN_WPS:-}
      CLIPES_MIN_PALAVRAS: ${CLIPES_MIN_PALAVRAS:-}
      GEMINI_API_KEYS:
      CLIPES_GEMINI_MODELS:
      CLIPES_GEMINI_MIN_INTERVAL_S:
      CLIPES_GEMINI_COTA_FILE: ${CLIPES_GEMINI_COTA_FILE:-}
      CLIPES_CLOUD_TIMEOUT: ${CLIPES_CLOUD_TIMEOUT:-}
      CLIPES_LLM_BACKEND:
      CLIPES_LLM_TIMEOUT: ${CLIPES_LLM_TIMEOUT:-}
      CLIPES_HOOK_TOP:
      CLIPES_BLUR_BG: ${CLIPES_BLUR_BG:-}
      CLIPES_LEGENDA_IDIOMA: ${CLIPES_LEGENDA_IDIOMA:-}
      CLIPES_LEGENDA_ORIGINAL: ${CLIPES_LEGENDA_ORIGINAL:-}
      CLIPES_CARTAO_FINAL: ${CLIPES_CARTAO_FINAL:-}
      CLIPES_DUR_MAX: ${CLIPES_DUR_MAX:-}
      CLIPES_DUR_MIN: ${CLIPES_DUR_MIN:-}
      CLIPES_GATE: ${CLIPES_GATE:-}
      CLIPES_HASHTAGS: ${CLIPES_HASHTAGS:-}
      CLIPES_HOOK_MAX_ATRASO: ${CLIPES_HOOK_MAX_ATRASO:-}
      CLIPES_LAYOUT_FALLBACK: ${CLIPES_LAYOUT_FALLBACK:-}
      CLIPES_VIGIA: ${CLIPES_VIGIA:-}
      CLIPES_TEMP_MAX: ${CLIPES_TEMP_MAX:-}
      CLIPES_TEMP_MIN: ${CLIPES_TEMP_MIN:-}
      CLIPES_RECURSOS_GERIDO: ${CLIPES_RECURSOS_GERIDO:-}
      CLIPES_MEM: ${CLIPES_MEM:-}
      CLIPES_CPUS: ${CLIPES_CPUS:-}
      CLIPES_JOBS: ${CLIPES_JOBS:-}
      CLIPES_RAM_POR_JOB: ${CLIPES_RAM_POR_JOB:-}
      CLIPES_MAX_BACKLOG: ${CLIPES_MAX_BACKLOG:-}
      CLIPES_BAR:
      CLIPES_BRAND_NAME:
      CLIPES_BRAND_DISPLAY:
      CLIPES_BRAND_LOGO:
      CLIPES_STARCUTS_OVERLAY: ${CLIPES_STARCUTS_OVERLAY:-}
      CLIPES_BAR_STYLE:
      CLIPES_BAR_H:
      CLIPES_LAYOUT:
      CLIPES_SPLIT_BAR_H:
      CLIPES_SPLIT_CAM_H:
      CLIPES_FACECAM_TTL_H:
      CLIPES_FACECAM_CONFIG: ${CLIPES_FACECAM_CONFIG:-}
      CLIPES_MONGO_URI:
      CLIPES_PC_ALIAS: ${CLIPES_PC_ALIAS:-}
      CLIPES_ALIAS:
      CLIPES_LEASE_S:
      CLIPES_BEAT_S:
      CLIPES_MIN_FREE_GB: ${CLIPES_MIN_FREE_GB:-}
      CLIPES_BUFFER_CAP_GB: ${CLIPES_BUFFER_CAP_GB:-}
      CLIPES_LIVE_CAPTURA_MORTA_S: ${CLIPES_LIVE_CAPTURA_MORTA_S:-}
      CLIPES_SLOTS: ${CLIPES_SLOTS:-}
      CLIPES_POLICY_FILE:
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN:
      DISCORD_CHANNEL_ID:
      DISCORD_LOG_CHANNEL_ID: ${DISCORD_LOG_CHANNEL_ID:-}
      DISCORD_GUILD_ID:
      DISCORD_ALLOWED_USER_IDS:
      CLIPES_DISCORD_MAX_MB:
      CLIPES_MASTER_MODE:
      CLIPES_RETENCAO_H:
      CLIPES_REGISTRO_VERIFICAR:
      YOUTUBE_CLIENT_ID:
      YOUTUBE_CLIENT_SECRET:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      TIKTOK_CLIENT_KEY:
      TIKTOK_CLIENT_ID:
      TIKTOK_CLIENT_SECRET:
      CLIPES_TOKENS_PATH:
      CLIPES_QUOTA_PATH: ${CLIPES_QUOTA_PATH:-}
      CLIPES_OAUTH_BIND:
      CLIPES_OAUTH_PORT:
      CLIPES_YT_MAX_DIA:
      CLIPES_YT_PRIVACY: ${CLIPES_YT_PRIVACY:-}
      CLIPES_TIKTOK_MAX_DIA:
      CLIPES_TIKTOK_PRIVACY: ${CLIPES_TIKTOK_PRIVACY:-}
      CLIPES_PUB_LEASE_S: ${CLIPES_PUB_LEASE_S:-}
      CLIPES_PUB_MAX_POR_CICLO: ${CLIPES_PUB_MAX_POR_CICLO:-}
      CLIPES_AGENDA_HORARIOS: ${CLIPES_AGENDA_HORARIOS-11:30,19:00}
      CLIPES_TZ: ${CLIPES_TZ:-America/Sao_Paulo}
      PAINEL_MONGO_URI: ${PAINEL_MONGO_URI:-}
      PAINEL_PORT: ${PAINEL_PORT:-8787}
    volumes:
      - clipes_models:/cache
      - ${OUT_DIR:-./out}:/out
      - ${CLIPES_CONFIG_DIR:-${HOME}/.config/clipes-lives}:/config

  # Vigia termico e de RAM/CPU (le .vigia/.recursos de /out). Unico servico com o socket do Docker (pausa/atualiza o
  # clipes); por isso sem segredos, sem rede publica, read_only e sem capabilities. Ocioso sob ./clipar (CLIPES_VIGIA_HOST).
  vigia:
    image: clipes-lives:latest
    user: "0:0"
    restart: unless-stopped
    read_only: true
    # DAC_OVERRIDE/CHOWN: gravar em /out (dono HOST_UID, modo 755) e devolver o dono dos arquivos ao usuario.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, CHOWN]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.25
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OUT_DIR: /out
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      CLIPES_VIGIA_HOST: ${CLIPES_VIGIA_HOST:-}
      CLIPES_LHM_URL: ${CLIPES_LHM_URL:-}
      CLIPES_VIGIA: ${CLIPES_VIGIA:-}
      CLIPES_TEMP_MAX: ${CLIPES_TEMP_MAX:-}
      CLIPES_TEMP_MIN: ${CLIPES_TEMP_MIN:-}
    volumes:
      - ${OUT_DIR:-./out}:/out
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "clipes.vigia"]

  bot:
    image: clipes-lives:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: ["bot"]
    restart: unless-stopped
    mem_limit: ${CLIPES_MEM:-5g}
    cpus: ${CLIPES_CPUS:-3}
    cpu_shares: 256
    environment:
      OUT_DIR: /out
      HOME: /cache
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      CLIPES_MONGO_URI:
      CLIPES_PC_ALIAS: ${CLIPES_PC_ALIAS:-}
      CLIPES_ALIAS:
      CLIPES_POLICY_FILE: ${CLIPES_POLICY_FILE:-}
      CLIPES_SLOTS: ${CLIPES_SLOTS:-}
      DISCORD_LOG_CHANNEL_ID: ${DISCORD_LOG_CHANNEL_ID:-}
      DISCORD_BOT_TOKEN:
      DISCORD_CHANNEL_ID:
      DISCORD_GUILD_ID:
      DISCORD_ALLOWED_USER_IDS:
      CLIPES_DISCORD_MAX_MB:
      CLIPES_MASTER_MODE:
      CLIPES_RETENCAO_H:
      CLIPES_REGISTRO_VERIFICAR:
      YOUTUBE_CLIENT_ID:
      YOUTUBE_CLIENT_SECRET:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      TIKTOK_CLIENT_KEY:
      TIKTOK_CLIENT_ID:
      TIKTOK_CLIENT_SECRET:
      CLIPES_TOKENS_PATH:
      CLIPES_QUOTA_PATH: ${CLIPES_QUOTA_PATH:-}
      CLIPES_YT_MAX_DIA:
      CLIPES_YT_PRIVACY: ${CLIPES_YT_PRIVACY:-}
      CLIPES_TIKTOK_MAX_DIA:
      CLIPES_TIKTOK_PRIVACY: ${CLIPES_TIKTOK_PRIVACY:-}
      CLIPES_PUB_LEASE_S: ${CLIPES_PUB_LEASE_S:-}
      CLIPES_PUB_MAX_POR_CICLO: ${CLIPES_PUB_MAX_POR_CICLO:-}
      CLIPES_AGENDA_HORARIOS: ${CLIPES_AGENDA_HORARIOS-11:30,19:00}
      CLIPES_TZ: ${CLIPES_TZ:-America/Sao_Paulo}
      PAINEL_MONGO_URI: ${PAINEL_MONGO_URI:-}
      PAINEL_PORT: ${PAINEL_PORT:-8787}
    volumes:
      - clipes_models:/cache
      - ${OUT_DIR:-./out}:/out
      - ${CLIPES_CONFIG_DIR:-${HOME}/.config/clipes-lives}:/config
    command: ["python", "-m", "clipes", "bot"]

  # Testes: sem montar a pasta de saida (o Docker criaria ./out como root).
  test:
    image: clipes-lives:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    mem_limit: ${CLIPES_MEM:-5g}
    cpus: ${CLIPES_CPUS:-3}
    cpu_shares: 256
    environment:
      HOME: /cache
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      CLIPES_CPU_THREADS: ${CLIPES_CPU_THREADS:-3}
    volumes:
      - clipes_models:/cache
    command: ["pytest", "-q"]

volumes:
  clipes_models:
