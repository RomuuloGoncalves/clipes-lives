services:
  clipes:
    build: .
    image: clipes-lives:latest
    user: "${UID:-1000}:${GID:-1000}"
    mem_limit: ${CLIPES_MEM:-8g}
    cpus: ${CLIPES_CPUS:-3}
    cpu_shares: 256
    environment:
      OUT_DIR: /out
      HOME: /cache
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      CLIPES_WHISPER_MODEL: ${CLIPES_WHISPER_MODEL:-small}
      CLIPES_CPU_THREADS: ${CLIPES_CPU_THREADS:-3}
      GEMINI_API_KEYS:
      CLIPES_GEMINI_MODELS:
      CLIPES_GEMINI_MIN_INTERVAL_S:
      CLIPES_LLM_BACKEND:
      CLIPES_HOOK_TOP:
      CLIPES_MONGO_URI:
      CLIPES_ALIAS:
      CLIPES_LEASE_S:
      CLIPES_BEAT_S:
      CLIPES_MIN_FREE_GB:
    volumes:
      - clipes_models:/cache
      - ${OUT_DIR:-${HOME}/Downloads/clipes-lives}:/out

  # Testes: sem montar a pasta de saida (o Docker criaria ~/Downloads/clipes-lives como root).
  test:
    image: clipes-lives:latest
    user: "${UID:-1000}:${GID:-1000}"
    mem_limit: ${CLIPES_MEM:-8g}
    cpus: ${CLIPES_CPUS:-3}
    cpu_shares: 256
    environment:
      HOME: /cache
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      CLIPES_CPU_THREADS: ${CLIPES_CPU_THREADS:-3}
    volumes:
      - clipes_models:/cache
    command: ["pytest", "-q"]

volumes:
  clipes_models:
