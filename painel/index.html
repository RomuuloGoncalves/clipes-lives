<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>Clipes Lives - Painel</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #182235;
      --border: #263248;
      --border-strong: #364663;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --ok: #22c55e;
      --ok-bg: rgba(34, 197, 94, 0.14);
      --ok-fg: #86efac;
      --off: #ef4444;
      --off-bg: rgba(239, 68, 68, 0.14);
      --off-fg: #fca5a5;
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.16);
      --warn-fg: #fde68a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-bg: rgba(59, 130, 246, 0.15);
      --accent-fg: #93c5fd;
      --btn: #dc2626;
      --btn-hover: #b91c1c;
      --radius: 12px;
      --radius-sm: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      max-width: 100%;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }

    .app {
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: 12px 12px 32px;
    }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      margin: -12px -12px 14px;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--ok);
      box-shadow: 0 0 0 4px var(--ok-bg);
      flex-shrink: 0;
    }

    .brand-mark.erro {
      background: var(--off);
      box-shadow: 0 0 0 4px var(--off-bg);
    }

    h1 {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
      white-space: nowrap;
    }

    .header-dir {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .meta {
      font-size: 0.8125rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .btn-ghost {
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--surface-2);
      border-color: var(--muted);
    }

    /* Feedback banner */
    .msg {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      font-size: 0.9375rem;
      word-break: break-word;
    }

    .msg:empty { display: none; }
    .msg.erro { border-color: var(--off); border-left-color: var(--off); background: var(--off-bg); color: var(--off-fg); }
    .msg.ok { border-color: var(--ok); border-left-color: var(--ok); background: var(--ok-bg); color: var(--ok-fg); }

    /* Summary KPI strip */
    .kpis {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .kpi-val {
      font-family: var(--mono);
      font-size: 1.375rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .kpi-val.ok { color: var(--ok-fg); }

    /* Section headings */
    .sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 22px 0 10px;
    }

    h2 {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .sec-sub {
      font-size: 0.8125rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Form & controls (44px+ touch targets, 16px input font to avoid iOS/Android zoom) */
    input[type="text"] {
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      width: 100%;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]::placeholder {
      color: var(--muted);
      opacity: 0.75;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }

    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--btn);
      color: #fff;
      font-weight: 600;
      font-size: 0.9375rem;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }

    button:hover:not(:disabled) { background: var(--btn-hover); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-outline-danger {
      background: var(--off-bg);
      color: var(--off-fg);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .btn-outline-danger:hover:not(:disabled) {
      background: var(--btn);
      color: #fff;
      border-color: var(--btn);
    }

    .alvo-form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* Badges & chips */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
    }

    .on { background: var(--ok-bg); color: var(--ok-fg); }
    .off { background: var(--off-bg); color: var(--off-fg); }

    .plat-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      color: var(--accent-fg);
    }

    .fase-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .nd {
      display: inline-block;
      background: var(--warn-bg);
      color: var(--warn-fg);
      border: 1px solid var(--warn);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: var(--mono);
    }

    .temp-warn { color: var(--warn-fg); font-weight: 700; }
    .temp-hot { color: var(--off-fg); font-weight: 700; }

    .slot-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .slot-chip {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .acao {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .acao input[type="text"] {
      font-family: var(--mono);
      text-transform: uppercase;
      min-width: 96px;
      flex: 1;
    }

    /* Cards lists (Lives ativas & Jobs 24h) */
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.9375rem;
      word-break: break-word;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .pill.meta {
      color: var(--muted);
      justify-content: flex-start;
    }

    /* Mobile-first card layout for tables (<= 720px) */
    .wrap {
      background: transparent;
      border: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
    }

    @media (max-width: 720px) {
      thead {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      table, tbody {
        display: block;
        width: 100%;
      }

      tbody tr {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 12px;
      }

      tbody tr:last-child {
        margin-bottom: 0;
      }

      tbody tr.tr-vazia {
        display: block;
        text-align: center;
        padding: 18px 14px;
      }

      tbody td {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 0;
        border: 0;
        white-space: normal;
        word-break: break-word;
        min-width: 0;
      }

      tbody td[data-label]::before {
        content: attr(data-label);
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      /* PC card header: name + online badge */
      #pcs td.td-nome {
        grid-column: 1 / 2;
        font-size: 1.0625rem;
        font-weight: 700;
        justify-content: center;
      }
      #pcs td.td-nome::before { display: none; }

      #pcs td.td-status {
        grid-column: 2 / 3;
        align-items: flex-end;
        justify-content: center;
      }
      #pcs td.td-status::before { display: none; }

      #pcs td.td-full,
      #pcs td.td-acao {
        grid-column: 1 / -1;
      }

      #pcs td.td-acao {
        margin-top: 4px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      #pcs td.td-acao::before { display: none; }

      #pcs .acao {
        flex-direction: column;
        align-items: stretch;
      }

      /* Alvo card header: entrada + plataforma */
      #alvos td.td-alvo {
        grid-column: 1 / -1;
        font-weight: 700;
        font-size: 1rem;
      }

      #alvos td.td-acao {
        grid-column: 1 / -1;
        margin-top: 4px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      #alvos td.td-acao::before { display: none; }
      #alvos td.td-acao button { width: 100%; }
    }

    /* Tablet & Desktop enhancements (>= 721px) */
    @media (min-width: 721px) {
      .app {
        padding: 20px 24px 40px;
      }

      .topbar {
        margin: -20px -24px 20px;
        padding: 12px 24px;
      }

      h1 { font-size: 1.25rem; }

      .kpis {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .alvo-form {
        grid-template-columns: minmax(220px, 2fr) minmax(140px, 1fr) auto;
        align-items: center;
      }

      .wrap {
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      table {
        font-size: 0.875rem;
      }

      th, td {
        padding: 11px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: rgba(24, 34, 53, 0.55);
        white-space: nowrap;
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      tr:last-child td { border-bottom: 0; }

      td.td-nome { font-weight: 600; white-space: nowrap; }
      td.td-alvo { max-width: 300px; word-break: break-word; font-weight: 500; }

      .acao input[type="text"] {
        width: 104px;
        flex: 0 0 auto;
      }

      .cards {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
      }
    }

    /* Modal de configuracao por PC */
    .sec-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cfg-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 8, 15, 0.78);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .cfg-modal-backdrop[hidden] {
      display: none;
    }

    .cfg-modal {
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .cfg-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }

    .cfg-modal-head h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .cfg-alias-row {
      padding: 12px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cfg-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .cfg-tab {
      min-height: 36px;
      padding: 6px 12px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--muted);
      font-size: 0.8125rem;
    }

    .cfg-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .cfg-modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .cfg-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .cfg-field.overridden {
      border-color: var(--accent);
    }

    .cfg-field label {
      font-family: var(--mono);
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--text);
    }

    .cfg-field-desc {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .cfg-field select {
      min-height: 40px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9375rem;
      font-family: inherit;
      width: 100%;
    }

    .cfg-modal-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }

    .cfg-modal-foot-right {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span id="status-dot" class="brand-mark" aria-hidden="true"></span>
        <h1>Clipes Lives</h1>
      </div>
      <div class="header-dir">
        <div id="atualizado" class="meta">Carregando...</div>
        <button id="refresh-btn" class="btn-ghost" type="button" aria-label="Atualizar agora">Atualizar</button>
      </div>
    </header>

    <div id="feedback" class="msg" role="status" aria-live="polite"></div>

    <section class="kpis" aria-label="Resumo geral">
      <div class="kpi">
        <span class="kpi-label">PCs online</span>
        <span id="kpi-pcs" class="kpi-val">-</span>
      </div>
      <div class="kpi">
        <span class="kpi-label">Lives ativas</span>
        <span id="kpi-lives" class="kpi-val">-</span>
      </div>
      <div class="kpi">
        <span class="kpi-label">Alvos ativos</span>
        <span id="kpi-alvos" class="kpi-val">-</span>
      </div>
      <div class="kpi">
        <span class="kpi-label">Jobs (24 h)</span>
        <span id="kpi-jobs" class="kpi-val">-</span>
      </div>
    </section>

    <div class="sec-head">
      <h2>PCs e workers</h2>
      <div class="sec-head-actions">
        <span id="pcs-count" class="sec-sub"></span>
        <button id="novo-pc-btn" class="btn-ghost" type="button">+ Configurar novo PC</button>
      </div>
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>PC</th>
            <th>Status</th>
            <th>CPU</th>
            <th>RAM</th>
            <th>Disco</th>
            <th>Temp</th>
            <th>GPU</th>
            <th>Job atual</th>
            <th>Slots</th>
            <th>Fila</th>
            <th>max_lives</th>
            <th>Acao</th>
          </tr>
        </thead>
        <tbody id="pcs"></tbody>
      </table>
    </div>

    <div class="sec-head">
      <h2>Lives ativas</h2>
      <span id="lives-count" class="sec-sub"></span>
    </div>
    <div id="lives" class="cards"></div>

    <div class="sec-head">
      <h2>Alvos ativos</h2>
      <span id="alvos-count" class="sec-sub"></span>
    </div>
    <form id="alvo-form" class="alvo-form">
      <input id="alvo-entrada" class="alvo-entrada" type="text" placeholder="URL ou login (ex: twitch.tv/canal)" aria-label="Alvo" autocomplete="off" autocapitalize="none" spellcheck="false">
      <input id="alvo-pc" type="text" placeholder="PC fixo (opcional)" aria-label="PC fixo (opcional)" autocomplete="off">
      <button type="submit" id="alvo-btn" class="btn-primary">adicionar alvo</button>
    </form>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>Alvo</th>
            <th>Plataforma</th>
            <th>PC fixo</th>
            <th>Dono</th>
            <th>Fase</th>
            <th>Acao</th>
          </tr>
        </thead>
        <tbody id="alvos"></tbody>
      </table>
    </div>

    <div class="sec-head">
      <h2>Jobs (24 h)</h2>
    </div>
    <div id="jobs" class="cards"></div>
  </div>

  <div id="config-modal" class="cfg-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="cfg-modal-title" hidden>
    <div class="cfg-modal">
      <div class="cfg-modal-head">
        <h3 id="cfg-modal-title">Configurar PC</h3>
        <button id="cfg-close-btn" class="btn-ghost" type="button" aria-label="Fechar configuracao">Fechar</button>
      </div>
      <div id="cfg-alias-row" class="cfg-alias-row" hidden>
        <label for="cfg-alias-input" class="meta">Apelido do PC (CLIPES_PC_ALIAS / CLIPES_ALIAS)</label>
        <input id="cfg-alias-input" type="text" placeholder="Ex: PC-1" autocomplete="off" spellcheck="false">
      </div>
      <div id="cfg-tabs" class="cfg-tabs" role="tablist"></div>
      <div id="cfg-fields" class="cfg-modal-body"></div>
      <div class="cfg-modal-foot">
        <button id="cfg-reset-btn" class="btn-outline-danger" type="button">Restaurar padroes</button>
        <div class="cfg-modal-foot-right">
          <button id="cfg-cancel-btn" class="btn-ghost" type="button">Cancelar</button>
          <button id="cfg-save-btn" class="btn-primary" type="button">Salvar no MongoDB</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var pcsEl = document.getElementById("pcs");
      var livesEl = document.getElementById("lives");
      var alvosEl = document.getElementById("alvos");
      var alvoForm = document.getElementById("alvo-form");
      var alvoEntradaEl = document.getElementById("alvo-entrada");
      var alvoPcEl = document.getElementById("alvo-pc");
      var alvoBtn = document.getElementById("alvo-btn");
      var jobsEl = document.getElementById("jobs");
      var atualizadoEl = document.getElementById("atualizado");
      var feedbackEl = document.getElementById("feedback");
      var refreshBtn = document.getElementById("refresh-btn");
      var statusDotEl = document.getElementById("status-dot");
      var kpiPcsEl = document.getElementById("kpi-pcs");
      var kpiLivesEl = document.getElementById("kpi-lives");
      var kpiAlvosEl = document.getElementById("kpi-alvos");
      var kpiJobsEl = document.getElementById("kpi-jobs");
      var pcsCountEl = document.getElementById("pcs-count");
      var livesCountEl = document.getElementById("lives-count");
      var alvosCountEl = document.getElementById("alvos-count");
      var drafts = Object.create(null);
      var carregando = false;
      var novoPcBtn = document.getElementById("novo-pc-btn");
      var configModalEl = document.getElementById("config-modal");
      var cfgModalTitleEl = document.getElementById("cfg-modal-title");
      var cfgAliasRowEl = document.getElementById("cfg-alias-row");
      var cfgAliasInputEl = document.getElementById("cfg-alias-input");
      var cfgTabsEl = document.getElementById("cfg-tabs");
      var cfgFieldsEl = document.getElementById("cfg-fields");
      var cfgCloseBtn = document.getElementById("cfg-close-btn");
      var cfgResetBtn = document.getElementById("cfg-reset-btn");
      var cfgCancelBtn = document.getElementById("cfg-cancel-btn");
      var cfgSaveBtn = document.getElementById("cfg-save-btn");
      var ultimoSchema = {};
      var cfgAtivoAlias = "";
      var cfgNovoPc = false;
      var cfgGrupoAtivo = "lives";
      var cfgValores = Object.create(null);
      var GRUPOS_CFG = [
        { id: "lives", label: "Slots e Lives" },
        { id: "render", label: "Layout e Marca" },
        { id: "ia", label: "IA, Portao e Traducao" },
        { id: "publicacao", label: "Master e Publicacao" }
      ];

      function el(tag, cls, txt) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (txt !== undefined && txt !== null) n.textContent = String(txt);
        return n;
      }

      function tdLabel(label, cls, txt) {
        var td = el("td", cls, txt);
        if (label) td.setAttribute("data-label", label);
        return td;
      }

      function mostrarMsg(texto, tipo) {
        feedbackEl.className = "msg" + (tipo ? " " + tipo : "");
        feedbackEl.textContent = texto || "";
      }

      function fmtNum(v, suf) {
        if (v === null || v === undefined || v === "") return "-";
        return String(v) + (suf || "");
      }

      function fmtCpu(cap) {
        var base = fmtNum(cap.cpus);
        if (cap.cpu_pct === null || cap.cpu_pct === undefined || cap.cpu_pct === "") return base;
        return (base === "-" ? "" : base + " ") + "(" + String(cap.cpu_pct) + "%)";
      }

      function fmtGpu(gpu) {
        if (!gpu) return "-";
        if (typeof gpu === "string") return gpu;
        var partes = [];
        var nome = gpu.nome || gpu.name;
        if (nome) partes.push(String(nome));
        var vram = gpu.vram_gb || gpu.vram_mb || gpu.vram;
        if (vram !== undefined && vram !== null) partes.push(String(vram));
        var uso = gpu.uso_pct !== undefined ? gpu.uso_pct : gpu.util_pct;
        if (uso !== undefined && uso !== null) partes.push(String(uso) + "%");
        if (gpu.temp_c !== undefined && gpu.temp_c !== null) partes.push(String(gpu.temp_c) + " C");
        return partes.length ? partes.join(" / ") : "-";
      }

      function enviarLiberar(worker, input, btn) {
        var nome = worker.alias || worker.id;
        var val = (input.value || "").trim();
        if (val !== "LIBERAR") {
          mostrarMsg("Digite LIBERAR para liberar recursos de " + nome + ".", "erro");
          input.focus();
          return;
        }
        if (!confirm("Liberar recursos de " + nome + "? O container sera encerrado e reiniciado.")) {
          return;
        }
        btn.disabled = true;
        fetch("/api/comando", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ worker_id: worker.id, confirmar: val })
        })
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (body) {
              return { status: r.status, body: body };
            });
          })
          .then(function (res) {
            if (res.status === 202) {
              drafts[worker.id] = "";
              input.value = "";
              mostrarMsg("Comando liberar recursos enviado para " + nome + ".", "ok");
              atualizar();
            } else {
              var erro = (res.body && res.body.erro) ? res.body.erro : ("HTTP " + res.status);
              mostrarMsg("Falha ao enviar comando: " + erro, "erro");
            }
          })
          .catch(function () {
            mostrarMsg("Erro de rede ao enviar comando.", "erro");
          })
          .finally(function () {
            btn.disabled = false;
          });
      }

      function enviarAlvo(corpo, btn, okMsg, aoOk) {
        btn.disabled = true;
        fetch("/api/alvos", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(corpo)
        })
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (body) {
              return { status: r.status, body: body };
            });
          })
          .then(function (res) {
            if (res.status >= 200 && res.status < 300) {
              mostrarMsg(okMsg, "ok");
              if (aoOk) aoOk();
              atualizar();
            } else {
              var erro = (res.body && res.body.erro) ? res.body.erro : ("HTTP " + res.status);
              mostrarMsg("Falha ao alterar alvos: " + erro, "erro");
            }
          })
          .catch(function () {
            mostrarMsg("Erro de rede ao alterar alvos.", "erro");
          })
          .finally(function () {
            btn.disabled = false;
          });
      }

      alvoForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var alvo = (alvoEntradaEl.value || "").trim();
        if (!alvo) {
          mostrarMsg("Informe o alvo (URL ou login).", "erro");
          alvoEntradaEl.focus();
          return;
        }
        var pc = (alvoPcEl.value || "").trim();
        enviarAlvo({ acao: "adicionar", alvo: alvo, pc: pc }, alvoBtn, "Alvo adicionado: " + alvo + ".", function () {
          alvoEntradaEl.value = "";
          alvoPcEl.value = "";
        });
      });

      refreshBtn.addEventListener("click", function () {
        atualizar();
      });

      function renderAlvos(alvos, workers) {
        var nomes = Object.create(null);
        (workers || []).forEach(function (w) {
          nomes[w.id] = w.alias || w.id;
        });
        var totalAlvos = alvos ? alvos.length : 0;
        kpiAlvosEl.textContent = String(totalAlvos);
        alvosCountEl.textContent = totalAlvos ? (totalAlvos + " ativo(s)") : "";

        if (!alvos || !alvos.length) {
          var trVazio = el("tr", "tr-vazia");
          var tdVazio = el("td", "meta", "Nenhum alvo ativo.");
          tdVazio.colSpan = 6;
          trVazio.appendChild(tdVazio);
          alvosEl.replaceChildren(trVazio);
          return;
        }
        var rows = alvos.map(function (a) {
          var tr = el("tr");
          var entrada = a.entrada || a._id;

          tr.appendChild(tdLabel("Alvo", "td-alvo", entrada));

          var tdPlat = tdLabel("Plataforma");
          tdPlat.appendChild(el("span", "plat-badge", a.plataforma || "-"));
          tr.appendChild(tdPlat);

          tr.appendChild(tdLabel("PC fixo", null, a.pc_fixo || "-"));
          tr.appendChild(tdLabel("Dono", null, a.owner ? (nomes[a.owner] || a.owner) : "sem PC"));

          var tdFase = tdLabel("Fase");
          tdFase.appendChild(el("span", "fase-badge", a.fase || "-"));
          tr.appendChild(tdFase);

          var tdAcao = el("td", "td-acao");
          var btn = el("button", "btn-outline-danger", "remover");
          btn.type = "button";
          btn.setAttribute("aria-label", "Remover " + entrada);
          btn.addEventListener("click", function () {
            enviarAlvo({ acao: "remover", id: a._id }, btn, "Alvo removido: " + entrada + ".");
          });
          tdAcao.appendChild(btn);
          tr.appendChild(tdAcao);
          return tr;
        });
        alvosEl.replaceChildren.apply(alvosEl, rows);
      }

      function renderWorkers(workers) {
        var list = workers || [];
        var onlineCount = list.filter(function (w) { return Boolean(w.online); }).length;
        kpiPcsEl.textContent = String(onlineCount) + "/" + String(list.length);
        kpiPcsEl.className = "kpi-val" + (onlineCount > 0 ? " ok" : "");
        pcsCountEl.textContent = list.length ? (onlineCount + " online de " + list.length) : "";

        var rows = [];
        if (!list.length) {
          var trVazio = el("tr", "tr-vazia");
          var tdVazio = el("td", "meta", "Nenhum PC registrado.");
          tdVazio.colSpan = 12;
          trVazio.appendChild(tdVazio);
          rows.push(trVazio);
          pcsEl.replaceChildren.apply(pcsEl, rows);
          return;
        }
        list.forEach(function (w) {
          var cap = w.capacity || {};
          var tr = el("tr");
          var label = w.alias || w.id;

          tr.appendChild(tdLabel("PC", "td-nome", label));

          var tdOn = tdLabel("Status", "td-status");
          tdOn.appendChild(el("span", "badge " + (w.online ? "on" : "off"), w.online ? "online" : "offline"));
          tr.appendChild(tdOn);

          tr.appendChild(tdLabel("CPU", "mono", fmtCpu(cap)));
          tr.appendChild(tdLabel("RAM", "mono", fmtNum(cap.ram_gb, " GB")));
          tr.appendChild(tdLabel("Disco livre", "mono", fmtNum(cap.disco_livre_gb, " GB")));

          var tdTemp = tdLabel("Temp", "mono");
          if (cap.temp_c === null || cap.temp_c === undefined) {
            tdTemp.appendChild(el("span", "nd", "n/d"));
          } else {
            var tempVal = Number(cap.temp_c);
            var tempCls = tempVal >= 85 ? "temp-hot" : (tempVal >= 75 ? "temp-warn" : "");
            tdTemp.appendChild(el("span", tempCls, String(cap.temp_c) + " C"));
          }
          tr.appendChild(tdTemp);

          tr.appendChild(tdLabel("GPU", "td-full", fmtGpu(cap.gpu)));
          tr.appendChild(tdLabel("Job atual", "td-full", w.job_atual || "-"));

          var slots = w.slots || {};
          var ocupados = w.ocupados || {};
          var tdSlots = tdLabel("Slots", "td-full");
          var slotKeys = Object.keys(slots);
          if (slotKeys.length) {
            var slotWrap = el("div", "slot-list");
            slotKeys.forEach(function (p) {
              slotWrap.appendChild(el("span", "slot-chip", p + " " + (ocupados[p] || 0) + "/" + slots[p]));
            });
            tdSlots.appendChild(slotWrap);
          } else {
            tdSlots.textContent = "-";
          }
          tr.appendChild(tdSlots);

          var fila = w.fila || {};
          var tamFila = Object.keys(fila).reduce(function (s, k) {
            return s + (Number(fila[k]) || 0);
          }, 0);
          tr.appendChild(tdLabel("Fila", "mono", w.fila ? String(tamFila) : "-"));

          tr.appendChild(tdLabel("max_lives", "mono", fmtNum(w.max_lives)));

          var tdAcao = el("td", "td-acao");
          var box = el("div", "acao");
          var input = el("input");
          input.type = "text";
          input.placeholder = "LIBERAR";
          input.setAttribute("aria-label", "Digite LIBERAR para " + label);
          input.setAttribute("autocomplete", "off");
          input.setAttribute("autocapitalize", "characters");
          input.setAttribute("spellcheck", "false");
          if (drafts[w.id]) input.value = drafts[w.id];
          input.addEventListener("input", function () {
            drafts[w.id] = input.value;
          });
          var btn = el("button", null, "liberar recursos");
          btn.type = "button";
          btn.addEventListener("click", function () {
            enviarLiberar(w, input, btn);
          });
          var cfgBtn = el("button", "btn-primary", "configurar");
          cfgBtn.type = "button";
          cfgBtn.setAttribute("aria-label", "Configurar " + label);
          cfgBtn.addEventListener("click", function () {
            abrirConfigModal(label, w.config || {}, false);
          });
          box.appendChild(cfgBtn);
          box.appendChild(input);
          box.appendChild(btn);
          tdAcao.appendChild(box);
          tr.appendChild(tdAcao);

          rows.push(tr);
        });
        pcsEl.replaceChildren.apply(pcsEl, rows);
      }

      function renderLives(lives, workers) {
        var nomes = Object.create(null);
        (workers || []).forEach(function (w) {
          nomes[w.id] = w.alias || w.id;
        });
        var totalLives = lives ? lives.length : 0;
        kpiLivesEl.textContent = String(totalLives);
        livesCountEl.textContent = totalLives ? (totalLives + " em andamento") : "";

        if (!lives || !lives.length) {
          livesEl.replaceChildren(el("div", "pill meta", "Nenhuma live ativa."));
          return;
        }
        var items = lives.map(function (l) {
          var dono = nomes[l.owner] || l.owner || "-";
          var canal = l.channel || l.id;
          var card = el("div", "pill");
          card.appendChild(el("span", null, canal));
          card.appendChild(el("span", "plat-badge", dono));
          return card;
        });
        livesEl.replaceChildren.apply(livesEl, items);
      }

      function renderJobs(jobs) {
        var keys = jobs ? Object.keys(jobs) : [];
        var totalJobs = keys.reduce(function (acc, k) { return acc + (Number(jobs[k]) || 0); }, 0);
        kpiJobsEl.textContent = String(totalJobs);

        if (!keys.length) {
          jobsEl.replaceChildren(el("div", "pill meta", "Sem jobs nas ultimas 24 h."));
          return;
        }
        var items = keys.sort().map(function (k) {
          var card = el("div", "pill");
          card.appendChild(el("span", "meta", k));
          card.appendChild(el("strong", "mono", String(jobs[k])));
          return card;
        });
        jobsEl.replaceChildren.apply(jobsEl, items);
      }

      function renderCfgTabs() {
        var tabs = GRUPOS_CFG.map(function (g) {
          var count = Object.keys(ultimoSchema).filter(function (k) {
            return ultimoSchema[k].grupo === g.id && cfgValores[k] !== undefined && cfgValores[k] !== "";
          }).length;
          var label = count ? (g.label + " (" + count + ")") : g.label;
          var btn = el("button", "cfg-tab" + (cfgGrupoAtivo === g.id ? " active" : ""), label);
          btn.type = "button";
          btn.setAttribute("role", "tab");
          btn.addEventListener("click", function () {
            cfgGrupoAtivo = g.id;
            renderCfgTabs();
            renderCfgFields();
          });
          return btn;
        });
        cfgTabsEl.replaceChildren.apply(cfgTabsEl, tabs);
      }

      function renderCfgFields() {
        var keys = Object.keys(ultimoSchema).filter(function (k) {
          return ultimoSchema[k].grupo === cfgGrupoAtivo;
        });
        if (!keys.length) {
          cfgFieldsEl.replaceChildren(el("div", "meta", "Nenhuma variavel neste grupo."));
          return;
        }
        var items = keys.map(function (k) {
          var meta = ultimoSchema[k];
          var val = cfgValores[k] || "";
          var box = el("div", "cfg-field" + (val !== "" ? " overridden" : ""));
          var lbl = el("label", null, k);
          lbl.setAttribute("for", "cfg-in-" + k);
          box.appendChild(lbl);
          if (meta.descricao) {
            box.appendChild(el("div", "cfg-field-desc", meta.descricao));
          }
          var ctrl;
          if ((meta.tipo === "enum" || meta.tipo === "bool") && Array.isArray(meta.opcoes)) {
            ctrl = el("select");
            var defTxt = meta.default !== "" ? ("Padrao: " + meta.default) : "Padrao: automatico";
            var optDef = el("option", null, defTxt);
            optDef.value = "";
            ctrl.appendChild(optDef);
            meta.opcoes.forEach(function (op) {
              var o = el("option", null, op);
              o.value = op;
              ctrl.appendChild(o);
            });
            ctrl.value = val;
            ctrl.addEventListener("change", function () {
              cfgValores[k] = ctrl.value;
              box.className = "cfg-field" + (ctrl.value !== "" ? " overridden" : "");
              renderCfgTabs();
            });
          } else {
            ctrl = el("input");
            ctrl.type = "text";
            ctrl.placeholder = "Padrao: " + (meta.default !== "" ? meta.default : "vazio");
            ctrl.value = val;
            ctrl.setAttribute("autocomplete", "off");
            ctrl.setAttribute("spellcheck", "false");
            ctrl.addEventListener("input", function () {
              cfgValores[k] = ctrl.value;
              box.className = "cfg-field" + (ctrl.value.trim() !== "" ? " overridden" : "");
              renderCfgTabs();
            });
          }
          ctrl.id = "cfg-in-" + k;
          box.appendChild(ctrl);
          return box;
        });
        cfgFieldsEl.replaceChildren.apply(cfgFieldsEl, items);
      }

      function abrirConfigModal(alias, configAtual, isNovo) {
        cfgNovoPc = Boolean(isNovo);
        cfgAtivoAlias = alias || "";
        cfgValores = Object.create(null);
        Object.keys(ultimoSchema).forEach(function (k) {
          cfgValores[k] = (configAtual && configAtual[k] !== undefined && configAtual[k] !== null)
            ? String(configAtual[k])
            : "";
        });
        cfgGrupoAtivo = "lives";
        cfgModalTitleEl.textContent = isNovo ? "Configurar novo PC" : ("Configurar PC: " + cfgAtivoAlias);
        cfgAliasRowEl.hidden = !isNovo;
        cfgAliasInputEl.value = cfgAtivoAlias;
        renderCfgTabs();
        renderCfgFields();
        configModalEl.hidden = false;
        if (isNovo) cfgAliasInputEl.focus();
      }

      function fecharConfigModal() {
        configModalEl.hidden = true;
      }

      novoPcBtn.addEventListener("click", function () {
        abrirConfigModal("", {}, true);
      });
      cfgCloseBtn.addEventListener("click", fecharConfigModal);
      cfgCancelBtn.addEventListener("click", fecharConfigModal);
      cfgResetBtn.addEventListener("click", function () {
        Object.keys(ultimoSchema).forEach(function (k) {
          cfgValores[k] = "";
        });
        renderCfgTabs();
        renderCfgFields();
      });
      cfgSaveBtn.addEventListener("click", function () {
        var alias = cfgNovoPc ? (cfgAliasInputEl.value || "").trim() : cfgAtivoAlias;
        if (!alias) {
          mostrarMsg("Informe o apelido do PC.", "erro");
          cfgAliasInputEl.focus();
          return;
        }
        var payloadCfg = Object.create(null);
        Object.keys(ultimoSchema).forEach(function (k) {
          var v = (cfgValores[k] || "").trim();
          payloadCfg[k] = v;
        });
        cfgSaveBtn.disabled = true;
        fetch("/api/config", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pc_alias: alias, config: payloadCfg })
        })
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (body) {
              return { status: r.status, body: body };
            });
          })
          .then(function (res) {
            if (res.status >= 200 && res.status < 300) {
              fecharConfigModal();
              mostrarMsg("Configuracao salva para " + alias + ".", "ok");
              atualizar();
            } else {
              var erro = (res.body && res.body.erro) ? res.body.erro : ("HTTP " + res.status);
              mostrarMsg("Falha ao salvar configuracao: " + erro, "erro");
            }
          })
          .catch(function () {
            mostrarMsg("Erro de rede ao salvar configuracao.", "erro");
          })
          .finally(function () {
            cfgSaveBtn.disabled = false;
          });
      });

      function atualizar() {
        if (carregando) return;
        carregando = true;
        refreshBtn.disabled = true;
        fetch("/api/status", {
          credentials: "same-origin"
        })
          .then(function (r) {
            if (!r.ok) {
              return r.json().catch(function () { return {}; }).then(function (b) {
                throw new Error((b && b.erro) ? b.erro : ("HTTP " + r.status));
              });
            }
            return r.json();
          })
          .then(function (dados) {
            if (dados.config_schema) ultimoSchema = dados.config_schema;
            renderWorkers(dados.workers || []);
            renderLives(dados.lives || [], dados.workers || []);
            renderAlvos(dados.alvos || [], dados.workers || []);
            renderJobs(dados.jobs_24h || {});
            statusDotEl.className = "brand-mark";
            atualizadoEl.textContent = "Atualizado: " + new Date().toLocaleTimeString();
          })
          .catch(function (err) {
            statusDotEl.className = "brand-mark erro";
            atualizadoEl.textContent = "Erro ao atualizar";
            mostrarMsg("Falha ao consultar /api/status: " + (err && err.message ? err.message : "erro"), "erro");
          })
          .finally(function () {
            carregando = false;
            refreshBtn.disabled = false;
          });
      }

      atualizar();
      setInterval(atualizar, 10000);
    })();
  </script>
</body>
</html>
